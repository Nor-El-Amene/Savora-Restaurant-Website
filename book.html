<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book a Table</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="book.css">
</head>
<body>

<a href="index.html" class="back-home-fixed">← Back to Home</a>

<section class="booking">

  <h1 class="booking-title">Book a Table</h1>
  <p class="booking-sub">Reserve your perfect dining moment</p>

  <!-- CUSTOMER INFO -->
  <div class="form-row">
    <div class="input-group">
      <label>👤 Your Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>
    </div>

    <div class="input-group">
      <label>📞 Phone Number</label>
      <input type="tel" id="phone" placeholder="e.g. 0550123456" required>
    </div>
  </div>

  <!-- DATE & TIME -->
  <div class="form-row">
    <div class="input-group">
      <label>📅 What date will you book?</label>
      <input type="date" id="date" required>
    </div>

    <div class="input-group">
      <label>⏰ What time will you arrive?</label>
      <input type="time" id="time" required>
    </div>
  </div>

  <!-- TABLE ZONES -->
  <div class="table-layout">
    <h3>Select Your Seating Area</h3>
    <div class="tables-layout"> 
    <p><span class="legend available"></span> Available &nbsp; <span class="legend booked"></span> Booked</p>
      </div>

    <div class="zone">
      <h4>⛺ Window</h4>
      <div class="tables">
        <div class="table available" data-table="Window 1">1</div>
        <div class="table booked">2</div>
        <div class="table available" data-table="Window 3">3</div>
        <div class="table available" data-table="Window 4">4</div>
        <div class="table available" data-table="Window 5">5</div>
        <div class="table available" data-table="Window 6">6</div>
        <div class="table booked">7</div>
      </div>
    </div>

    <div class="zone">
      <h4>🏛 Center</h4>
      <div class="tables">
        <div class="table available" data-table="Center 8">8</div>
        <div class="table available" data-table="Center 9">9</div>
        <div class="table available" data-table="Center 10">10</div>
        <div class="table booked">11</div>
        <div class="table available" data-table="Center 12">12</div>
        <div class="table available" data-table="Center 13">13</div>
        <div class="table available" data-table="Center 14">14</div>
      </div>
    </div>

    <div class="zone">
      <h4>🌿 Balcony & Terrace</h4>
      <div class="tables">
        <div class="table booked">15</div>
        <div class="table available" data-table="Balcony 16">16</div>
        <div class="table available" data-table="Balcony 17">17</div>
        <div class="table available" data-table="Balcony 18">18</div>
        <div class="table booked">19</div>
        <div class="table available" data-table="Balcony 20">20</div>
        <div class="table booked">21</div>
        <div class="table booked">22</div>
      </div>
    </div>
  </div>

  <input type="hidden" id="selectedTable">
  <p class="selected-table-text"></p>
  <p class="error-text"></p>

  <button class="confirm-btn">Confirm Reservation</button>

</section>

<script src="book.js"></script>
</body>
</html>
