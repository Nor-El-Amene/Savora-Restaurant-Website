<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Tagesschrift&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="contact.css">
</head>
<body>
<a href="index.html" class="back-btn top-right">
  ← Home
</a>
<section class="contact">

  <h1 class="contact-title">Get in Touch</h1>
  <p class="contact-small">We’d Love to Hear From You</p>

  <div class="contact-cards">
    <div class="card">
      <img src="Gemini_Generated_Image_84s9y284s9y284s9.png" alt="Phone Icon">
      <h3>Call Us</h3>
      <p>+213 555 123 456</p>
    </div>

    <div class="card">
      <img src="Gemini_Generated_Image_jh6xu0jh6xu0jh6x.png" alt="Email Icon">
      <h3>Email Us</h3>
      <p>savora@yourrestaurant.com</p>
    </div>

    <div class="card">
      <img src="Gemini_Generated_Image_q1vhx6q1vhx6q1vh.png" alt="Location Icon">
      <h3>Visit Us</h3>
      <p>123 Foodie Street, Biskra, Algeria</p>
    </div>
  </div>

  <div class="contact-form">
    <h3>Send a Message</h3>
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <p class="footer-text">We Can’t Wait to Hear From You!</p>

</section>

<script src="contact.js"></script>
</body>
</html>
